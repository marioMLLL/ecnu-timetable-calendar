<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>课表导入日历</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="logo">历</div>
        <div><h1>课表导入日历</h1><p id="platformSubtitle">ECNU → 系统日历</p></div>
      </header>

      <section class="settings">
        <label>第 1 周周一<input id="firstMonday" type="date"></label>
        <label>提前提醒
          <select id="reminder">
            <option value="0">上课时</option>
            <option value="5">5 分钟</option>
            <option value="10">10 分钟</option>
            <option value="15" selected>15 分钟</option>
            <option value="30">30 分钟</option>
            <option value="60">1 小时</option>
          </select>
        </label>
        <label class="wide">日历名称<input id="calendarName" value="华师大课表" maxlength="40"></label>
      </section>

      <button id="scan" class="secondary" type="button">读取并预览课程</button>
      <div id="status" role="status">请先打开学生管理系统的“我的课表”页面。</div>
      <section id="preview" hidden>
        <div class="preview-title"><strong id="summary"></strong><span id="eventSummary"></span></div>
        <div id="courseList"></div>
      </section>
      <section id="qrPanel" class="qr-panel" hidden>
        <div class="qr-title"><strong>用手机相机扫描</strong><span>不上传课表 🔒</span></div>
        <img id="qrImage" alt="手机课表导入二维码">
        <p>支持 iPhone 与 Android；扫码页会自动选择适合当前系统的导入方式。</p>
      </section>
      <section id="actions" class="actions" hidden>
        <button id="export" class="primary" type="button" disabled>导入到系统日历</button>
        <button id="qr" class="secondary qr-button" type="button" disabled>手机扫码导入</button>
      </section>
      <section id="subscriptionPanel" class="subscription-panel">
        <div class="subscription-title"><strong>私人课表订阅</strong><span>自动同步调课</span></div>
        <p class="privacy-warning">⚠️ 拿到订阅链接的人可以看到课程名称、时间和地点。请勿公开分享。学校 Cookie、SESSION 和学号不会上传。</p>
        <label>自动删除日期<input id="subscriptionExpiry" type="date"></label>
        <div id="subscriptionInactive">
          <button id="createSubscription" class="secondary compact" type="button" disabled>创建私人订阅</button>
        </div>
        <div id="subscriptionActive" hidden>
          <label>订阅地址<input id="subscriptionUrl" type="text" readonly></label>
          <p id="subscriptionMeta" class="subscription-meta"></p>
          <div class="subscription-actions">
            <button id="copySubscription" class="secondary compact" type="button">复制地址</button>
            <button id="syncSubscription" class="secondary compact" type="button">立即同步</button>
            <button id="regenerateSubscription" class="secondary compact" type="button">重新生成</button>
            <button id="revokeSubscription" class="danger compact" type="button">撤销订阅</button>
          </div>
        </div>
        <p id="subscriptionStatus" class="subscription-meta" role="status"></p>
      </section>
      <p id="platformTip" class="tip">先读取并预览课程；日历准备完成后，再点击导入。</p>
    </main>
    <script src="vendor/lz-string.min.js"></script>
    <script src="vendor/qrcode.js"></script>
    <script src="lib/schedule-core.js"></script>
    <script src="lib/mobile-payload.js"></script>
    <script src="lib/subscription-config.js"></script>
    <script src="lib/subscription-client.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
